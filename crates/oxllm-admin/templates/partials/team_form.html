<form hx-post="/teams/create"
      hx-target="#teams-panel"
      hx-swap="outerHTML"
      hx-disabled-elt="find button[type='submit']"
      @htmx:after-request="if (oxRequestSucceeded($event)) showForm = false">
  <div class="ox-form-grid">
    <div class="ox-input">
      <label for="team_name">Team Name</label>
      <input id="team_name" type="text" name="team_name" placeholder="Engineering" required autocomplete="off">
    </div>
    <div class="ox-input">
      <label for="team_max_budget">Max Budget ($)</label>
      <input id="team_max_budget" type="number" step="0.01" min="0" name="max_budget" placeholder="(optional)">
    </div>
    <div class="ox-input">
      <label for="team_budget_duration">Budget Duration</label>
      <input id="team_budget_duration" type="text" name="budget_duration" placeholder="30d">
    </div>
    <div class="ox-input">
      <label for="team_rpm">RPM</label>
      <input id="team_rpm" type="number" min="0" name="rpm" placeholder="(optional)">
    </div>
    <div class="ox-input">
      <label for="team_tpm">TPM</label>
      <input id="team_tpm" type="number" min="0" name="tpm" placeholder="(optional)">
    </div>
    <div class="ox-input" style="grid-column: 1 / -1;">
      <label for="team_models">Allowed Models</label>
      <input id="team_models" type="text" name="models" placeholder="gpt-4o, claude-* (comma-separated; blank = all)" autocomplete="off">
      <small style="color: var(--ox-muted); font-size: .72rem;">Comma-separated patterns or a JSON string array. <code>*</code> wildcard supported. Blank = no restriction.</small>
    </div>
  </div>
  <div class="ox-form-actions">
    <button type="submit" class="ox-btn ox-btn-primary">Create Team</button>
    <button type="button" class="ox-btn" @click="showForm = false">Cancel</button>
  </div>
</form>
