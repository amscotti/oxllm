{{- if or (and .Values.admin.enabled (or (not .Values.admin.sessionSecretRef) (not .Values.admin.passwordSecret))) (and .Values.persistence.enabled (not .Values.persistence.existingSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: oxllm
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingSecret) }}
  {{ .Values.persistence.databaseUrlSecretKey }}: {{ .Values.persistence.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.admin.enabled }}
  {{- if not .Values.admin.sessionSecretRef }}
  {{- if lt (len .Values.admin.sessionSecret) 16 }}
  {{- fail "admin.sessionSecret must be at least 16 characters (or use admin.sessionSecretRef)" }}
  {{- end }}
  admin-session-secret: {{ .Values.admin.sessionSecret | quote }}
  {{- end }}
  {{- if not .Values.admin.passwordSecret }}
  {{- $_ := required "admin.uiPassword must be set when admin is enabled (or use admin.passwordSecret)" (.Values.admin.uiPassword | trim) }}
  admin-ui-password: {{ .Values.admin.uiPassword | quote }}
  {{- end }}
  {{- end }}
{{- end }}
