model_list:
  # === Bedrock ===
  - model_name: bedrock-deepseek
    oxllm_params:
      model: bedrock/deepseek.v3.2
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region: us-east-1

  - model_name: bedrock-deepseek-converse
    oxllm_params:
      model: bedrock/deepseek.v3.2
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region: us-east-1
      use_converse_api: true

  # === Mantle ===
  - model_name: mantle-gpt-oss
    oxllm_params:
      model: bedrock_mantle/openai.gpt-oss-120b
      aws_access_key_id: os.environ/MANTLE_AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/MANTLE_AWS_SECRET_ACCESS_KEY
      aws_region: us-east-1

  # === OpenAI Realtime ===
  - model_name: gpt-realtime
    oxllm_params:
      model: openai/gpt-realtime
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  master_key: os.environ/OXLLM_MASTER_KEY
  allow_private_api_base: true
