{{- if .Values.admin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-admin
  labels:
    app.kubernetes.io/name: oxllm-admin
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.admin.service.type }}
  ports:
    - port: {{ .Values.admin.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: oxllm-admin
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
