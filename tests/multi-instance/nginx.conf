# nginx load balancer for the 3-instance oxllm stress test.
# - Round-robin across oxllm-a (:4000), oxllm-b (:4001) and oxllm-c (:4002) by default.
# - Proxy buffering OFF so SSE streaming is not held until the request ends.
# - Passive health checks (max_fails/fail_timeout): a dead instance is ejected
#   for 10s after 2 failures, so the "kill one instance" scenario drains.
# - Long timeouts to tolerate the soak + slow upstream.

events {
    worker_connections 4096;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    upstream oxllm {
        # nginx default LB method is round-robin.
        server oxllm-a:4000 max_fails=2 fail_timeout=10s;
        server oxllm-b:4001 max_fails=2 fail_timeout=10s;
        server oxllm-c:4002 max_fails=2 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;

        # Streaming-friendly: do not buffer the response.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Tolerate long generations + the soak.
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Pass every path through; oxllm owns the routes (/v1/*, /health,
        # /metrics, /model/*, /spend/*, etc.).
        location / {
            proxy_pass http://oxllm;
        }
    }
}
