# Production-oriented docker-compose config.
# Secrets come from the environment (os.environ/…).

model_list:
  - model_name: gpt-4o
    oxllm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      timeout: 120
      stream_timeout: 60
      rpm: 480
      tpm: 1000000

  - model_name: claude
    oxllm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 120
      stream_timeout: 60

  - model_name: grok
    oxllm_params:
      model: xai/grok-3
      api_key: os.environ/XAI_API_KEY
      timeout: 120
      stream_timeout: 60

  - model_name: grok-4.5
    oxllm_params:
      model: xai/grok-4.5
      api_key: os.environ/XAI_API_KEY
      timeout: 120
      stream_timeout: 90

  # Claude Code default model ids → Grok 4.5
  - model_name: claude-sonnet-4-5-20250929
    oxllm_params:
      model: xai/grok-4.5
      api_key: os.environ/XAI_API_KEY
      timeout: 120
  - model_name: claude-haiku-4-5-20251001
    oxllm_params:
      model: xai/grok-4.5
      api_key: os.environ/XAI_API_KEY
      timeout: 120

  # Catch-all for openai/* model ids from SDKs.
  - model_name: "*"
    oxllm_params:
      model: openai/*
      api_key: os.environ/OPENAI_API_KEY

oxllm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 120
  routing_strategy: simple-shuffle
  # Redis-backed DualCache for fleet-correct RPM/TPM/budget counters.
  cache:
    type: redis
    host: redis
    port: 6379
  cache_ttl_secs: 600

general_settings:
  master_key: os.environ/OXLLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Optional: set a strong JWT_SECRET in .env AND uncomment this line to enable
  # JWT auth. DB-managed credential encryption separately uses ENCRYPTION_KEY.
  # jwt_secret: os.environ/JWT_SECRET
  # Required: the Redis cache above lives on the private compose network, and
  # local sidecars (Ollama/vLLM) do too — private targets are rejected unless
  # this is set. Keep it `false` for public-only deployments.
  allow_private_api_base: true
  max_request_body_size_mb: 10
  # Behind docker-compose / k8s network, trust only the compose network if you
  # terminate TLS at a proxy in front. Uncomment and set peer CIDRs as needed:
  # trusted_proxy_cidrs:
  #   - 10.0.0.0/8
  shutdown_timeout_secs: 30
