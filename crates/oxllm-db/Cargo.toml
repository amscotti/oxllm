[package]
name = "oxllm-db"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Database persistence layer for oxllm"

[dependencies]
# Note: oxllm-db is intentionally independent of oxllm-core (persistence
# types live here; pure domain types stay in core). Layering tests allow
# the edge but it is unused — do not re-add without a concrete type share.
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
jiff.workspace = true
anyhow.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
postgres = ["dep:sqlx", "dep:tokio"]
sqlite = ["dep:sqlx", "dep:tokio"]
